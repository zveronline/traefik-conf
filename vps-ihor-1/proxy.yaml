http:
  # Add the router
  routers:
    straefik:
      entryPoints:
        - websecure
      service: straefik
      rule: "HostRegexp(`[a-z]+\\.k3kw\\.ru`)"
      priority: 1
      middlewares:
        - default@file
      tls:

    tonargorn:
      entryPoints:
        - websecure
      service: frps
      rule: "Host(`tonargorn.ru`) || Host(`www.tonargorn.ru`) || Host(`auth.tonargorn.ru`)"
      priority: 1
      middlewares:
        - default@file
      tls:

  services:
    straefik:
      loadBalancer:
        serversTransport: immich-transport@file
        servers:
        - url: https://192.168.1.85:9443
        passHostHeader: true
    frps:
      loadBalancer:
        servers:
        - url: http://frps:8080
        passHostHeader: true

tcp:
  routers:
    vless-tachyon:
      rule: "HostSNI(i.tonargorn.ru)"
      entryPoints:
        - websecure
      service: vless-tachyon
      tls:
      passthrough: true

  services:
    vless-tachyon:
      loadBalancer:
        servers:
          - address: "10.23.0.1:9009"