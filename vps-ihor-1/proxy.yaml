http:
  # Add the router
  routers:
    obsidian:
      entryPoints:
        - websecure
      service: obsidian
      rule: "Host(`obsidian.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:
    webdav:
      entryPoints:
        - websecure
      service: webdav
      rule: "Host(`wd.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:
    wordpress:
      entryPoints:
        - websecure
      service: wordpress
      rule: "Host(`k3kw.ru`) || Host(`www.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:
    fileserv:
      entryPoints:
        - websecure
      service: fileserv
      rule: "Host(`c.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:
    immich:
      entryPoints:
        - websecure
      service: immich
      rule: "Host(`pics.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:
    torrent:
      entryPoints:
        - websecure
      service: torrent
      rule: "Host(`t.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:

  services:
    obsidian:
      loadBalancer:
        servers:
        - url: http://192.168.1.85:5984
        passHostHeader: true
    webdav:
      loadBalancer:
        servers:
        - url: https://192.168.1.85:5006
        passHostHeader: true
    wordpress:
      loadBalancer:
        servers:
        - url: http://192.168.1.85:8083
        passHostHeader: true
    fileserv:
      loadBalancer:
        servers:
        - url: http://192.168.1.85:8084
        passHostHeader: true
    immich:
      loadBalancer:
        servers:
        - url: http://192.168.1.85:2283
        passHostHeader: true
    torrent:
      loadBalancer:
        servers:
        - url: http://192.168.1.85:8085
        passHostHeader: true