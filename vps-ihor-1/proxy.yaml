http:
  # Add the router
  routers:
    straefik:
      entryPoints:
        - websecure
      service: straefik
      rule: "HostRegexp(`[a-z]+\\.k3kw\\.ru`)"
      priority: 1
      middlewares:
        - default@file
      tls:

  services:
    straefik:
      loadBalancer:
        servers:
        - url: https://192.168.1.85:9443
        passHostHeader: true