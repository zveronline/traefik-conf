http:
  # Add the router
  routers:
    webdav:
      entryPoints:
        - websecure
      service: webdav
      rule: "Host(`wd.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:
    wordpress:
      entryPoints:
        - websecure
      service: wordpress
      rule: "Host(`k3kw.ru`) || Host(`www.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:
    torrent:
      entryPoints:
        - websecure
      service: torrent
      rule: "Host(`t.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:
    straefik:
      entryPoints:
        - websecure
      service: straefik
      rule: "HostRegexp(`[a-z]+\\.k3kw\\.ru`)"
      priority: 1
      middlewares:
        - default@file
      tls:

  services:
    webdav:
      loadBalancer:
        servers:
        - url: https://192.168.1.85:5006
        passHostHeader: true
    wordpress:
      loadBalancer:
        servers:
        - url: http://192.168.1.85:8083
        passHostHeader: true
    torrent:
      loadBalancer:
        servers:
        - url: http://192.168.1.85:8085
        passHostHeader: true
    straefik:
      loadBalancer:
        servers:
        - url: https://192.168.1.85:9443
        passHostHeader: true