http:
  # Add the router
  routers:
    openwrt:
      entryPoints:
        - websecure
      service: openwrt
      rule: "Host(`vps.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:

  # Add the service
  services:
    openwrt:
      loadBalancer:
        servers:
        - url: http://10.23.0.1:9091
        passHostHeader: true