http:
  # Add the router
  routers:
    ha2:
      entryPoints:
        - websecure
      service: ha2
      rule: "Host(`ha2.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:
        certResolver: cloudflare
        domains:
          - main: "z-network.ru"
            sans:
              - "*.z-network.ru"
    gw2:
      entryPoints:
        - websecure
      service: gw2
      rule: "Host(`gw2.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:
        certResolver: cloudflare
        domains:
          - main: "z-network.ru"
            sans:
              - "*.z-network.ru"
              
  # Add the service
  services:
    ha2:
      loadBalancer:
        servers:
        - url: http://10.5.1.1:8123
        passHostHeader: true
    gw2:
      loadBalancer:
        servers:
#        - url: http://10.242.255.245:80
        - url: http://10.5.0.1:80
        passHostHeader: true