http:
  # Add the router
  routers:
    webdav:
      entryPoints:
        - websecure
      service: webdav
      rule: "Host(`wd.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:
    torrent:
      entryPoints:
        - websecure
      service: torrent
      rule: "Host(`t.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:
    pbs:
      entryPoints:
        - websecure
      service: pbs
      rule: "Host(`pxb.k3kw.ru`)"
      middlewares:
        - gzip@file
      tls:

  services:
    webdav:
      loadBalancer:
        servers:
        - url: https://192.168.1.85:5006
        passHostHeader: true
    torrent:
      loadBalancer:
        servers:
        - url: http://192.168.1.85:8085
        passHostHeader: true
    pbs:
      loadBalancer:
        servers:
        - url: http://192.168.1.85:8007
        passHostHeader: true