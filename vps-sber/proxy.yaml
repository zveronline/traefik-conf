http:
  # Add the router
  routers:
    block-bad-ip:
      rule: "Host(`ordinary-minecraft.ru`) && ClientIP(`85.93.42.67`)"
      service: noop@internal
      priority: 1000
      entryPoints:
        - websecure
        
    znetwork:
      entryPoints:
        - websecure
      service: traefik-1
      rule: "HostRegexp(`[a-z]+\\.z-network\\.ru`)"
      priority: 1
      middlewares:
        - gzip@file
      tls:

    znetwork-4:
      entryPoints:
        - websecure
      service: traefik-4
      rule: "Host(`vscode.z-network.ru`) || Host(`torrserv.z-network.ru`) || Host(`traefik-4.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:

    zveronline:
      entryPoints:
        - websecure
      service: traefik-1
      rule: "HostRegexp(`[a-z]+\\.zveronline\\.ru`)"
      priority: 1
      middlewares:
        - default@file
      tls:

    zveronline-4:
      entryPoints:
        - websecure
      service: traefik-4
      rule: "Host(`file.zveronline.ru`) || Host(`gpt.zveronline.ru`) || Host(`jelly.zveronline.ru`) || Host(`kiwix.zveronline.ru`) || Host(`peertube.zveronline.ru`) || Host(`tube.zveronline.ru`) || Host(`book.zveronline.ru`) || Host(`s1.zveronline.ru`) || Host(`alpac.zveronline.ru`)"
      middlewares:
        - default@file
      tls:

    wordpress:
      entryPoints:
        - websecure
      service: traefik-1
      rule: "Host(`zveronline.ru`)"
      middlewares:
        - default@file
      tls:

    wordpress-astro:
      entryPoints:
        - websecure
      service: traefik-1
      rule: "Host(`astro-kirov.ru`)"
      middlewares:
        - default@file
      tls:

    tonargorn:
      entryPoints:
        - websecure
      service: traefik-1
      rule: "Host(`tonargorn.ru`) || Host(`www.tonargorn.ru`) || Host(`auth.tonargorn.ru`)"
      middlewares:
        - default@file
      tls:

    vm-docker-1-http:
      entryPoints:
        - web
      service: traefik-1-http
      rule: "Host(`alpac.zveronline.ru`)"
      priority: 2000
      middlewares:
        - gzip@file
    ordinary:
      entryPoints:
        - websecure
      service: traefik-4
      rule: "Host(`ordinary-minecraft.ru`) || Host(`www.ordinary-minecraft.ru`) || Host(`wiki.ordinary-minecraft.ru`) || Host(`radio.ordinary-minecraft.ru`) || Host(`legacy.ordinary-minecraft.ru`) || Host(`genesis.ordinary-minecraft.ru`) || Host(`bans.ordinary-minecraft.ru`) || Host(`inferno.ordinary-minecraft.ru`) || Host(`portal.ordinary-minecraft.ru`) || Host(`video.ordinary-minecraft.ru`) || Host(`sessionserver.ordinary-minecraft.ru`)"
      middlewares:
        - gzip@file
#        - my-geoblock@file
#        - block-bad-ip@file
#        - simple_ratelimit@file
      tls:
        certResolver: cloudflare
        domains:
          - main: "ordinary-minecraft.ru"
            sans:
              - "*.ordinary-minecraft.ru"
    ordinary-http:
      entryPoints:
        - web
      service: traefik-4-http
      rule: "Host(`sessionserver.ordinary-minecraft.ru`)"
      priority: 2000
      middlewares:
        - gzip@file
#        - my-geoblock@file

  # Add the service
  services:
    traefik-1:
      loadBalancer:
        servers:
        - url: https://10.22.200.253:9443
        passHostHeader: true
    traefik-1-http:
      loadBalancer:
        servers:
        - url: http://10.3.1.13:80
        passHostHeader: true
    traefik-4:
      loadBalancer:
        servers:
        - url: https://10.22.200.253:9002
        passHostHeader: true
    traefik-4-http:
      loadBalancer:
        servers:
        - url: http://10.3.1.3:80
        passHostHeader: true