http:
  # Add the router
  routers:
    openwrt:
      entryPoints:
        - websecure
      service: openwrt
      rule: "Host(`vps-sber.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:

    cudywrt:
      entryPoints:
        - websecure
      service: cudywrt
      rule: "Host(`cudywrt.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:

    cudy2:
      entryPoints:
        - websecure
      service: cudy2
      rule: "Host(`cudy2.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:

    m3000:
      entryPoints:
        - websecure
      service: m3000
      rule: "Host(`m3000.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:

    beryl:
      entryPoints:
        - websecure
      service: beryl
      rule: "Host(`beryl.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:

    ha2:
      entryPoints:
        - websecure
      service: ha2
      rule: "Host(`ha2.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:

    gw2:
      entryPoints:
        - websecure
      service: gw2
      rule: "Host(`gw2.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:

    mcsm-sto2:
      entryPoints:
        - websecure
      service: mcsm-sto2
      rule: "Host(`mcsm-sto2.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:

    mcsm-wss:
      entryPoints:
        - websecure
      service: mcsm-wss
      rule: "Host(`mcsm-wss.zveronline.ru`)"
      middlewares:
        - gzip@file
      tls:
              
  # Add the service
  services:
    openwrt:
      loadBalancer:
        servers:
        - url: http://10.22.0.1:9092
        passHostHeader: true
    ha2:
      loadBalancer:
        servers:
        - url: http://10.5.1.1:8123
        passHostHeader: true
    gw2:
      loadBalancer:
        servers:
#        - url: http://10.242.255.245:80
        - url: http://10.5.0.1:80
        passHostHeader: true
    cudywrt:
      loadBalancer:
        servers:
        - url: http://10.0.23.6:80
        passHostHeader: true
    cudy2:
      loadBalancer:
        servers:
        - url: http://10.7.1.1:80
#        - url: http://10.242.191.88:80
        passHostHeader: true
    m3000:
      loadBalancer:
        servers:
        - url: http://10.0.23.8:80
        passHostHeader: true
    beryl:
      loadBalancer:
        servers:
        - url: http://10.7.4.1:80
#        - url: http://10.242.191.88:80
        passHostHeader: true
    mcsm-sto2:
      loadBalancer:
        servers:
        - url: http://10.5.0.100:24444/
        passHostHeader: true
    mcsm-wss:
      loadBalancer:
        servers:
        - url: http://10.3.1.3:24444/
