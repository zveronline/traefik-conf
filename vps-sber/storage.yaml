http:
  # Add the router
  routers:
    sto2:
      entryPoints:
        - synology
      service: sto2
      rule: "Host(`sto2.z-network.ru`)"
      middlewares:
        - default@file
      tls:

    sto2-443:
      entryPoints:
        - websecure
      service: sto2-443
      rule: "Host(`sto2.z-network.ru`)"
      middlewares:
        - default@file
      tls:

    drive:
      entryPoints:
        - websecure
      service: sto-443
      rule: "Host(`drive.zveronline.ru`)"
      middlewares:
        - default@file
      tls:

  # Add the service
  services:
    sto2:
      loadBalancer:
        servers:
          - url: https://10.5.0.100:5001
        passHostHeader: true
    sto2-443:
      loadBalancer:
        servers:
          - url: https://10.5.0.100
        passHostHeader: true
    sto-443:
      loadBalancer:
        servers:
          - url: https://10.3.0.100
        passHostHeader: true