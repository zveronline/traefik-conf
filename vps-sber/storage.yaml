http:
  # Add the router
  routers:
    sto2-443:
      entryPoints:
        - websecure
      service: sto2-443
      rule: "Host(`sto2.z-network.ru`)"
      middlewares:
        - default@file
      tls:

    drive:
      entryPoints:
        - websecure
      service: traefik-1
      rule: "Host(`drive.zveronline.ru`)"
      middlewares:
        - default@file
      tls:

  # Add the service
  services:
    sto2-443:
      loadBalancer:
        servers:
          - url: https://10.5.0.100
        passHostHeader: true