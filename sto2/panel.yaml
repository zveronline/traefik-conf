http:
  # Add the router
  routers:
    ha2:
      entryPoints:
        - websecure
      service: ha2
      rule: "Host(`ha2.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:

    gw2:
      entryPoints:
        - websecure
      service: gw2
      rule: "Host(`gw2.z-network.ru`)"
      middlewares:
        - gzip@file
      tls:
              
  # Add the service
  services:
    ha2:
      loadBalancer:
        servers:
        - url: http://10.5.1.1:8123
        passHostHeader: true
    gw2:
      loadBalancer:
        servers:
        - url: http://10.5.0.1:80
        passHostHeader: true